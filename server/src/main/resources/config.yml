# ProjectMemo 配置
# role: single（单服，测试/生产前置） = writer（生产主服，M4+ 开 Redis 镜像） = mirror（创造服只读，M5）
role: single

# 每人每日可创建的大条目（工程）上限，按服务器时区自然日重置
daily-project-limit: 2

# AuthMe 登录后发送进服按钮
join-button: true

# 定时兜底存盘间隔（分钟）；数据变更时也会即时原子存盘
save-interval-min: 5

# QQ bot 事件行（M3）：立项/竣工/删除时打 [MEMO-EVENT] JSON 日志行供 bot 播报；mirror 无写操作天然无事件
qq-events: true

# wiki 导出（M4 启用；开启后写 plugins/ProjectMemo/wiki-export/）
wiki-export: false
# wiki 导出防抖秒数（数据变更后延迟导出，期间多次变更合并为一次）
wiki-export-debounce-sec: 60

# v1.2.0：工程选址 → LocationMarker(!!loc) 自动同步（经 MCDR remote_console 发送官方命令；条目入库后归 !!loc 管理）
# mode: socket（生产） = dry-run（只记日志，供无 MCDR 的测试服） = off；mirror 角色永不写
loc-sync:
  mode: socket
  remote-console-host: 127.0.0.1
  remote-console-port: 25999

# v1.2.0：LocationMarker 路标库路径（相对服务器工作目录，与 LocBridge 同约定；地标查看用，只读）
locations-file: ../config/location_marker/locations.json

# Redis 创造服只读镜像（M5 启用；single/writer 默认关闭）
redis:
  enabled: false
  host: 127.0.0.1
  port: 6379
  password: ""
  channel: memo
  # 快照键（writer SET / mirror GET）；测试请用隔离键如 memo-test:snapshot
  snapshot-key: memo:snapshot
# ── v1.2.0-arcmenu：ArcMenu 只读展示接入层 ──
# 给没装 memo 客户端模组的玩家提供游戏内只读浏览（工程/地标/使用说明/导览/信息/排行榜/指令）
# 依赖 ArcMenu + PlaceholderAPI（缺任一自动停用，memo 其他功能不受影响）
arcmenu:
  enabled: true
  rows-per-page: 8
  list-capacity-pages: 6      # 工程列表每分类 6 页 × 8 行 = 48 槽
  loc-pages-per-dim: 3        # 地标每维度 3 页 × 8 行 = 24 槽
  entry-command: memoui
  # 数据变更后重建菜单文件的防抖秒数
  export-debounce-sec: 5
  # 详情页重建后的重载窗口：no-players（等无人在线）= immediate = off
  reload-guard: no-players
  reload-check-sec: 30
  reload-max-wait-min: 30
  # 排行榜数据源：复用 MCDR !!stats 查询（主服 25999 / 测试服 25998）
  stats:
    host: 127.0.0.1
    remote-console-port: 25999
  stats-refresh-min: 1

  # ── 页面文案（可直接修改；改后 /memo arcmenu export + 重载生效）──
  info-lines:
    - "&8服务器：&0奇怪服（Leaves 1.21.11 原版生存）"
    - "&8线路：&0腾讯云主线 / 阿里云备线"
    - "&8QQ 群 / wiki / 地图：&0见 wiki 首页"
    - "&8（文案待服主审定）"
  # ── 常用指令（多页；每页一条 title + lines）──
  # ── 常用指令：分类结构（入口页列出分类，点进各分类详情页）──
  cmds-categories:
    - id: "mcdr"
      title: "MCDR 指令"
      lines:
        - "&2<路标 !!loc>=&8同步到地图网页"
        - "&0!!loc=&8- 查看帮助"
        - "&0!!loc list=&8- 所有共享路标"
        - "&0!!loc add <名称> here [备注]=&8- 当前位置加路标"
        - "&0!!loc add <名称> <x> <y> <z> <维度>=&8- 指定坐标"
        - "&0!!loc search <关键词>=&8- 搜索路标"
        - "&0!!loc info <名称>=&8- 路标详情"
        - "&0!!loc del <名称>=&8- 删除路标"
        - "&8维度用英文：overworld / the_nether / the_end"
        - "&2<数据 !!stats>=&8与 ESC 统计同源"
        - "&0!!stats=&8- 帮助（可点击）"
        - "&0!!stats me=&8- 自己六项 + 全服排名"
        - "&0!!stats online=&8- 在线时长排行榜"
        - "&0!!stats mine=&8- 挖掘数排行榜"
        - "&0!!stats place=&8- 放置数排行榜"
        - "&0!!stats kill=&8- 击杀数排行榜"
        - "&0!!stats achievement=&8- 成就数排行榜"
        - "&0!!stats death=&8- 死亡数排行榜"
      clickable:
        - line: 10
          chat: "!!stats"
        - line: 11
          chat: "!!stats me"
    - id: "bot"
      title: "假人 /bot"
      lines:
        - "&c需向管理员或 helper 申请权限"
        - "&2<创建 / 移除 / 列表>"
